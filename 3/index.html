<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Nights at Freddy's 3</title>
    <link rel="icon" href="favicon.ico" />
    <style>
 @import url('https://fonts.googleapis.com/css2?family=Creepster&family=Fredoka:wght@400;700&display=swap');

      html { display:block; -webkit-user-select:none; -ms-user-select:none; user-select:none; overflow:hidden; height:100%; }

      body {
        position: relative; margin:0; height:100%; color:#fff;
        font-family: 'Fredoka', system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif;
        background: url('resources/office.png') center/cover no-repeat;
        background-attachment: fixed;
        margin: 0; 
        padding: 0;
        display: flex;
    justify-content: center; /* Center horizontally */
    align-items: center;     /* Center vertically */
      }

            body::before {
                content: '';
                position: fixed;
                top: 0; left: 0;
                width: 100%; height: 100%;
                background: linear-gradient(135deg, rgba(10,10,10,0.7) 0%, rgba(26,10,26,0.7) 50%, rgba(15,15,31,0.7) 100%);
                pointer-events: none;
                z-index: 1;
                transition: opacity 700ms ease;
                opacity: 1;
            }

            body.game-loaded::before { opacity: 0; }

      .title-section { display:flex; align-items:center; justify-content:center; gap:30px; margin: 18px 0; }
      .title-section h1 { font-family: 'Creepster', cursive; color:#ff4444; font-size:2.4rem; text-shadow: 0 0 10px rgba(255,68,68,0.8); }
      .title-section img { height: 140px; filter: drop-shadow(0 0 20px rgba(255,68,68,0.4)); }

      .selection { width:100%; min-height: calc(100vh - 120px); display:flex; align-items:center; justify-content:center; position:relative; z-index: 4; }

    .vignette, .glitch { position:fixed; inset:0; pointer-events:none; }
    .glitch { background-image: url(resources/background.gif); background-position:center; background-size:auto; background-repeat:repeat; opacity:0.75; z-index:2; transition: opacity 600ms ease; }
    .vignette { z-index: 3; opacity:1; transition: opacity 600ms ease; }
      .vignette img { width:100%; height:100%; object-fit:cover; }

      canvas { display:none; user-select:none}

      #title { position:absolute; top:8vh; left:5vw; z-index:2; height:20vh; }
      #animatronic { position:absolute; top:-5vh; right:7vw; height:120vh; z-index:1; }

      .loader {
        position:absolute; display:flex; flex-direction:column; align-items:center; left:50%; transform:translateX(-50%);
        bottom: 10vh; z-index:3; color:#fff; font-family: 'Fredoka', monospace; text-align:center; width:85vw;
      }
      .loader h1 { margin:0; font-size:5vw; color:#ff6b6b; text-shadow: 0 0 8px rgba(255,68,68,0.6); }
      .loader hr { margin:8px 0; border: none; height: 6px; width: 0%; background: linear-gradient(90deg,#8b0000,#ff4444); border-radius:6px; }
      .loader h2 { margin: 6px 0 0; font-size:1.1rem; color:#ccc; }

      .tips-container { position:absolute; top:4vh; left:50%; transform:translateX(-50%); max-width:80vw; background: rgba(0,0,0,0.6); border:2px solid #8b0000; padding:14px; border-radius:8px; color:#fff; z-index:4; opacity:0; transition:opacity .3s ease; }
      .tips-container.show { opacity:1; }
      .tips-container h3 { margin:0 0 8px 0; color:#8b5cf6; }
      .tips-container p { margin:0; color:#ddd; }
    </style>
            
            </head>

            <body>
                <div class="tips-container" id="tipsContainer">
                    <h3>💡 PRO TIP</h3>
                    <p id="tipText"></p>
                </div>
                <canvas id="MMFCanvas" width="1024" height="768"> Your browser does not support Canvas, Please try again.</canvas>
                <div class="selection" id="selection">
                    <img id="title" src="resources/title.png">
                    <img id="animatronic" src="resources/animatronic.png">
                    <div class="loader">
                        <h1 id="percentage">0%</h1>
                        <hr id="bar">
                        <h2 id="stage">STARTING UP...</h2>
                    </div>
                    <a href="https://discord.gg/xuu8TnSY4b">
                        <div class="launcher-text"><img src="resources/launcher-text.png" style="width: 45vw;"></div>
                    </a>
                </div>
                <div class="glitch"></div>
                <img src="resources/vignette.png" class="vignette">
                <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
            </body>
            <!--Made by irv77-->
            <script>
                // Loading audio setup
                const loadingAudioSrc = '/resources/loading-music.mp3';
                const loadingAudio = new Audio(loadingAudioSrc);
                loadingAudio.loop = true;
                loadingAudio.volume = 0.6;

                function tryPlayLoadingAudio(){
                    if (loadingAudio.playPromise) return;
                    const p = loadingAudio.play();
                    loadingAudio.playPromise = p;
                    if (p !== undefined) {
                        p.catch(() => {
                            const resume = () => {
                                loadingAudio.play().catch(()=>{});
                                document.removeEventListener('click', resume, {capture:true});
                                document.removeEventListener('keydown', resume, {capture:true});
                            };
                            document.addEventListener('click', resume, {capture:true});
                            document.addEventListener('keydown', resume, {capture:true});
                        });
                    }
                }

                function fadeOutAndStop(audio, duration = 800) {
                    if (!audio || audio.paused) return;
                    const start = audio.volume;
                    const steps = 30;
                    const stepTime = Math.max(8, duration / steps);
                    let i = 0;
                    const timer = setInterval(() => {
                        i++;
                        const v = Math.max(0, start * (1 - i / steps));
                        audio.volume = v;
                        if (i >= steps) {
                            clearInterval(timer);
                            try { audio.pause(); audio.currentTime = 0; } catch(e){}
                            audio.volume = start;
                        }
                    }, stepTime);
                    }

                    function fadeOutElement(selector, duration = 600) {
                        const el = document.querySelector(selector);
                        if (!el) return;
                        el.style.transition = `opacity ${duration}ms ease`;
                        el.style.opacity = '0';
                        setTimeout(() => { try { el.style.display = 'none'; } catch(e) {} }, duration + 30);
                    }

                    tryPlayLoadingAudio();

                    const parts = 20;
                let gametitle, runtimecanvas
                gametitle = document.title;
                runtimecanvas = "resources/fnaf 3.cch";

                // Tips system
                const tips = [
                    "Use audio lures to redirect Springtrap away from your location!",
                    "Ventilation control is your best defense - direct vents away from your area.",
                    "Don't stay on one camera for too long - Springtrap learns your patterns!",
                    "Seal vents before Springtrap can crawl through them - timing is critical.",
                    "Audio decoys are ESSENTIAL - use them strategically to buy time.",
                    "Multiple threats from vents means you need to seal them quickly and efficiently.",
                    "Camera blind spots exist - Springtrap uses them to approach unseen.",
                    "Maintenance must be done when systems fail - neglecting repairs causes breaches.",
                    "Late-night shifts are harder - Springtrap becomes more aggressive over time.",
                    "Don't panic if Springtrap appears in your vent - act calmly and seal it!",
                    "Phantom hallucinations appear on cameras - viewing them has special effects.",
                    "Audio lures take time to work - plan ahead for optimal results.",
                    "Check all vent locations regularly to monitor Springtrap's position.",
                    "Power management is less critical than camera and audio usage.",
                    "Springtrap has a specific route pattern - learn it to predict his movements!",
                    "Some areas are more vulnerable than others - reinforce critical vents.",
                    "Constant alertness is key - never let your guard down for a second!"
                ];

                let tipsIndex = 0;
                const tipsContainer = document.getElementById('tipsContainer');
                const tipText = document.getElementById('tipText');
                let tipsCycleInterval;

                function showRandomTip() {
                    tipsIndex = Math.floor(Math.random() * tips.length);
                    tipText.textContent = tips[tipsIndex];
                    tipsContainer.classList.add('show');
                }

                function startTipsCycle() {
                    showRandomTip();
                    tipsCycleInterval = setInterval(showRandomTip, 5000);
                }

                function hideTips() {
                    clearInterval(tipsCycleInterval);
                    tipsContainer.classList.remove('show');
                }

                startTipsCycle();

                // Prevents touchscreen move
                window.addEventListener("scroll", preventMotion, false);
                window.addEventListener("touchmove", preventMotion, false);
                function preventMotion(event) {
                    window.scrollTo(0, 0);
                    event.preventDefault();
                    event.stopPropagation();
                }
                // Fullscreen Key
                const pressedKeys = {};
                document.addEventListener('keydown', event => {
                    pressedKeys[event.key] = true;
                    if (pressedKeys['-'] && pressedKeys['=']) {
                        document.querySelector('canvas').requestFullscreen();
                        delete pressedKeys[event.key];
                    }
                });
                document.addEventListener('keyup', (event) => {
                    delete pressedKeys[event.key];
                });
                // -----------------
                window.onload = function () {
                    const map = new Map();

                    function updateProgress(text, percent) {
                        document.title = percent + '% ' + gametitle
                        document.getElementById('percentage').innerHTML = percent + '%';
                        document.getElementById('bar').style.width = percent + '%';
                        document.getElementById('stage').innerHTML = text;
                    }

                    async function intercept() {
                        const ogfetch = window.fetch;
                        window.fetch = async function (input, init) {
                            if (typeof input === 'string' && input.startsWith('resources/')) {
                                const fileName = input.split('/').pop();
                                if (map.has(fileName)) {
                                    return ogfetch(map.get(fileName), init);
                                }
                            }
                            return ogfetch(input, init);
                        };

                        const ogopen = XMLHttpRequest.prototype.open;
                        XMLHttpRequest.prototype.open = function (method, url) {
                            if (url.startsWith('resources/')) {
                                const fileName = url.split('/').pop();
                                if (map.has(fileName)) {
                                    url = map.get(fileName);
                                }
                            }
                            return ogopen.apply(this, arguments);
                        };

                        const types = [HTMLImageElement, HTMLAudioElement, HTMLVideoElement];
                        for (const Tag of types) {
                            const descriptor = Object.getOwnPropertyDescriptor(Tag.prototype, 'src');
                            if (descriptor && descriptor.set) {
                                Object.defineProperty(Tag.prototype, 'src', {
                                    configurable: true,
                                    enumerable: true,
                                    get: descriptor.get,
                                    set: function (val) {
                                        if (typeof val === 'string' && val.startsWith('resources/')) {
                                            const fileName = val.split('/').pop();
                                            if (map.has(fileName)) {
                                                val = map.get(fileName);
                                            }
                                        }
                                        descriptor.set.call(this, val);
                                    }
                                });
                            }
                        }
                    }

                    async function extract() {
                        const res = await fetch("resources.zip");

                        const contentLength = res.headers.get("Content-Length");
                        const total = parseInt(contentLength, 10);
                        const reader = res.body.getReader();
                        let loaded = 0;
                        const chunks = [];

                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;
                            chunks.push(value);
                            loaded += value.length;
                            updateProgress('RETURNING GEARS...', Math.floor((loaded / total / 2) * 100));
                        }

                        const arrayBuffer = await new Blob(chunks).arrayBuffer();
                        const zip = await JSZip.loadAsync(arrayBuffer);
                        const files = Object.keys(zip.files).filter(name => !zip.files[name].dir);
                        const totalFiles = files.length;

                        for (let i = 0; i < totalFiles; i++) {
                            const file = zip.files[files[i]];
                            const blob = await file.async("blob");
                            const url = URL.createObjectURL(blob);
                            map.set(files[i], url);
                            updateProgress('BOOTING UP ARCHIVE...', Math.floor(((i + 1) / totalFiles / 2) * 100 + 50));
                        }
                    }

                    async function wedone() {
                        await extract();
                        await intercept();

                        fadeOutAndStop(loadingAudio, 1000);
                        // Fade out the launcher UI (keep canvas visible)
                        fadeOutElement('#selection', 1000);
                        fadeOutElement('.tips-container', 1000);
                        fadeOutElement('.launcher-text', 1000);
                        fadeOutElement('.glitch', 1000);
                        fadeOutElement('.vignette', 1000);
                        hideTips();

                        const script = document.createElement('script');
                        script.src = 'src/Runtime.js';
                        script.onload = () => {
                            new Runtime("MMFCanvas", runtimecanvas);
                        };
                        document.getElementById('MMFCanvas').style.display = 'block';
                        document.body.classList.add('game-loaded');
                        document.getElementById('selection').style.display = 'none';
                        document.title = gametitle;
                        document.head.appendChild(script);
                    }

                    const originalFetch = window.fetch;

                    function mergeFiles(fileParts) {
                        return new Promise((resolve, reject) => {
                            let buffers = [];
                            let totalSize = 0;
                            let loadedSize = 0;
                            Promise.all(fileParts.map(part =>
                                fetch(part, { method: 'HEAD' }).then(res => {
                                    try {
                                        if (!res.ok) throw new Error("Missing part: " + part);
                                        return parseInt(res.headers.get("Content-Length") || "0", 10);
                                    } catch (error) { document.getElementById('stage').innerHTML = "ERROR: MISSING FILE(S)..." }
                                })
                            )).then(sizes => {
                                totalSize = sizes.reduce((a, b) => a + b, 0);
                                function fetchPart(index) {
                                    if (index >= fileParts.length) {
                                        let mergedBlob = new Blob(buffers);
                                        let mergedFileUrl = URL.createObjectURL(mergedBlob);
                                        resolve(mergedFileUrl);
                                        return;
                                    }

                                    fetch(fileParts[index]).then((response) => {
                                        if (!response.ok) throw new Error("Missing part: " + fileParts[index]);
                                        return response.arrayBuffer();
                                    }).then((data) => {
                                        buffers.push(data);
                                        loadedSize += data.byteLength;
                                        updateProgress('LOCATING ARCHIVE...', Math.floor((loadedSize / totalSize / 2) * 100));
                                        fetchPart(index + 1);
                                    }).catch(reject);
                                }

                                fetchPart(0);
                            }).catch(reject);
                        });
                    }

                    function getParts(file, start, end) {
                        let parts = [];
                        for (let i = start; i <= end; i++) {
                            parts.push(file + ".part" + i);
                        }
                        return parts;
                    }
                    Promise.all([
                        mergeFiles(getParts("src/resources.zip", 1, parts))
                    ]).then(([resources]) => {
                        window.fetch = async function (url, ...args) {
                            if (url.endsWith("resources.zip")) {
                                return originalFetch(resources, ...args);
                            } else {
                                return originalFetch(url, ...args);
                            }
                        };
                        wedone();
                    });
            };
    </script>

    <!-- Pause overlay and hold-Esc exit -->
    <script>
    (function(){
        // Create overlay
        const css = `
        .pause-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:9999;align-items:center;justify-content:center}
        .pause-menu{background:linear-gradient(135deg,#1a0a1a,#2d1a2d);padding:30px;border:3px solid #8b0000;color:#fff;max-width:420px;text-align:center;border-radius:6px}
        .pause-menu h2{color:#ff4444;margin:0 0 8px}
        .pause-menu p{color:#ccc;margin:0 0 12px}
        .pause-menu button{background:#ff4444;border:none;color:#fff;padding:8px 12px;cursor:pointer}
        `;
        const style = document.createElement('style'); style.textContent = css; document.head.appendChild(style);

        const overlay = document.createElement('div'); overlay.id = 'pauseOverlay'; overlay.className = 'pause-overlay';
        overlay.innerHTML = `<div class="pause-menu"><h2>Paused</h2><p>Press Esc to resume</p><button id="exitFullscreenBtn">Hold Esc to Exit Fullscreen</button></div>`;
        document.body.appendChild(overlay);

        let escHoldTimer = null; const ESC_HOLD_MS = 800; let isPaused = false;
        function showPause(){ isPaused = true; overlay.style.display = 'flex'; }
        function hidePause(){ isPaused = false; overlay.style.display = 'none'; }
        function togglePause(){ if(isPaused) hidePause(); else showPause(); }

        document.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ if(escHoldTimer == null){ escHoldTimer = setTimeout(()=>{ escHoldTimer = null; // held long enough -> exit fullscreen if possible
                    if(document.fullscreenElement){ document.exitFullscreen(); }
                }, ESC_HOLD_MS); } } });

        document.addEventListener('keyup', function(e){ if(e.key === 'Escape'){ if(escHoldTimer){ // released before hold threshold -> treat as tap to toggle pause
                    clearTimeout(escHoldTimer); escHoldTimer = null; togglePause(); } } });

        // Also close overlay on click
        overlay.addEventListener('click', function(e){ if(e.target === overlay) hidePause(); });
        const exitBtn = document.getElementById('exitFullscreenBtn'); if(exitBtn){ exitBtn.addEventListener('click', function(){ if(document.fullscreenElement) document.exitFullscreen(); }); }
    })();
    </script>

    <script>
    (function(){
        const overlay = document.getElementById('pauseOverlay');
        if(!overlay) return;
        const ESC_HOLD_MS = 800; let escHoldTimer = null; let isPaused = false;
        function showPause(){ isPaused = true; overlay.style.display = 'flex'; window.__paused = true; window.dispatchEvent(new Event('blur')); document.dispatchEvent(new Event('visibilitychange')); }
        function hidePause(){ isPaused = false; overlay.style.display = 'none'; window.__paused = false; window.dispatchEvent(new Event('focus')); document.dispatchEvent(new Event('visibilitychange')); }
        function togglePause(){ if(isPaused) hidePause(); else showPause(); }
        document.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ if(document.fullscreenElement){ try{ e.preventDefault(); }catch{} } if(escHoldTimer == null){ escHoldTimer = setTimeout(()=>{ escHoldTimer = null; if(document.fullscreenElement) document.exitFullscreen(); }, ESC_HOLD_MS); } } });
        document.addEventListener('keyup', function(e){ if(e.key === 'Escape'){ if(escHoldTimer){ clearTimeout(escHoldTimer); escHoldTimer = null; togglePause(); } } });
        overlay.addEventListener('click', function(e){ if(e.target === overlay) hidePause(); });
        const exitBtn = document.getElementById('exitFullscreenBtn'); if(exitBtn){ exitBtn.addEventListener('click', function(){ if(document.fullscreenElement) document.exitFullscreen(); }); }
    })();
    </script>
