<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FNaF Fan Wiki — Animatronics</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #121824;
      --accent: #e67e22; /* amber/orange */
      --accent2: #8e44ad; /* purple */
      --text: #e8ecf1;
      --muted: #aab3c0;
      --danger: #e74c3c;
      --ok: #2ecc71;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif; }
    a { color: var(--accent); }

    header {
      position: sticky; top: 0; z-index: 50;
      background: linear-gradient(180deg, rgba(18,24,36,0.95), rgba(18,24,36,0.85));
      backdrop-filter: blur(6px);
      border-bottom: 1px solid #1e2534;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 16px; }
    .title { display: flex; align-items: center; gap: 12px; }
    .title h1 { margin: 0; font-size: 1.6rem; }
    .badge { background: #1e2534; color: var(--muted); padding: 4px 8px; border-radius: 999px; font-size: 0.85rem; }

    .controls { display: grid; grid-template-columns: 1fr 220px 220px; gap: 12px; margin-top: 12px; }
    input[type="search"], select { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #273045; background: #0f141d; color: var(--text); }
    input::placeholder { color: #6b7485; }

    main { padding: 18px 16px 48px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .card { background: var(--panel); border: 1px solid #1e2534; border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform 0.15s ease, border-color 0.2s ease; }
    .card:hover { transform: translateY(-2px); border-color: #2a3349; }
    .thumb { aspect-ratio: 4 / 3; background: #0f141d; display: grid; place-items: center; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .card .meta { padding: 10px 12px 12px; }
    .card .name { font-weight: 700; margin-bottom: 4px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { font-size: 0.75rem; padding: 2px 8px; border: 1px solid #273045; border-radius: 999px; color: #b9c2d3; }

    /* Modal */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.68); display: none; align-items: center; justify-content: center; z-index: 100; }
    .modal { width: min(920px, 92vw); background: var(--panel); border: 1px solid #2a3349; border-radius: 14px; overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,0.45); }
    .modal header { background: linear-gradient(180deg, #151c2b, #121824); border-bottom: 1px solid #2a3349; position: static; }
    .modal .head { display: flex; align-items: center; justify-content: space-between; }
    .modal .head h2 { margin: 0; font-size: 1.4rem; }
    .modal .close { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #2a3349; background: #101624; color: var(--muted); padding: 8px 10px; border-radius: 8px; cursor: pointer; }
    .modal .close:hover { color: var(--text); border-color: #3a4564; }
    .modal .body { display: grid; grid-template-columns: 1fr 1.1fr; gap: 18px; padding: 16px; }
    .modal .imgWrap { background: #0f141d; border: 1px solid #1e2534; border-radius: 12px; overflow: hidden; }
    .modal .imgWrap img { width: 100%; height: auto; display: block; }
    .modal .section { margin-bottom: 14px; }
    .modal h3 { margin: 0 0 8px; font-size: 1.05rem; color: var(--accent); }
    .pill { display: inline-block; padding: 4px 8px; border-radius: 999px; border: 1px solid #273045; margin: 0 6px 6px 0; font-size: 0.85rem; color: #b9c2d3; }
    ul { margin: 6px 0 0; padding-left: 18px; }

    footer { border-top: 1px solid #1e2534; color: var(--muted); padding: 16px; text-align: center; }

    /* Mobile tweaks */
    @media (max-width: 720px) {
      .controls { grid-template-columns: 1fr; }
      .modal .body { grid-template-columns: 1fr; }
    }
  </style>
</head>

    // === Rendering & UI logic ===
    const grid = document.getElementById('grid');
    const q = document.getElementById('q');
    const series = document.getElementById('series');
    const sortSel = document.getElementById('sort');
    const countBadge = document.getElementById('countBadge');

    const backdrop = document.getElementById('backdrop');
    const closeBtn = document.getElementById('closeBtn');
    const modalName = document.getElementById('modalName');
    const modalImg = document.getElementById('modalImg');
    const modalBehavior = document.getElementById('modalBehavior');
    const modalStrategies = document.getElementById('modalStrategies');
    const appearancePills = document.getElementById('appearancePills');
    const tagPills = document.getElementById('tagPills');

    function sanitize(str) { return (str || '').toString(); }

    function renderCards(list) {
      grid.innerHTML = '';
      list.forEach(item => {
        const card = document.createElement('article');
        card.className = 'card';
        card.setAttribute('role', 'button');
        card.setAttribute('tabindex', '0');
        card.setAttribute('aria-label', item.name);
        card.innerHTML = `
          <div class="thumb">
            <img src="${sanitize(item.image)}" alt="${sanitize(item.name)} image" loading="lazy" />
          </div>
          <div class="meta">
            <div class="name">${sanitize(item.name)}</div>
            <div class="chips">
              ${(item.appearances.games || []).slice(0, 2).map(g => `<span class='chip'>${sanitize(g)}</span>`).join('')}
              ${(item.appearances.books || []).slice(0, 1).map(b => `<span class='chip'>${sanitize(b)}</span>`).join('')}
            </div>
          </div>
        `;
        card.addEventListener('click', () => openModal(item));
        card.addEventListener('keydown', (e) => { if (e.key === 'Enter') openModal(item); });
        grid.appendChild(card);
      });
      countBadge.textContent = `${list.length} shown`;
    }

    function openModal(item) {
      modalName.textContent = item.name;
      modalImg.src = item.image;
      modalImg.alt = item.name;
      modalBehavior.textContent = item.behavior;
      modalStrategies.innerHTML = '';
      (item.strategies || []).forEach(s => {
        const li = document.createElement('li');
        li.textContent = s;
        modalStrategies.appendChild(li);
      });
      appearancePills.innerHTML = '';
      (item.appearances.games || []).forEach(g => {
        const span = document.createElement('span');
        span.className = 'pill';
        span.textContent = g;
        appearancePills.appendChild(span);
      });
      (item.appearances.books || []).forEach(b => {
        const span = document.createElement('span');
        span.className = 'pill';
        span.textContent = b;
        appearancePills.appendChild(span);
      });
      tagPills.innerHTML = '';
      (item.tags || []).forEach(t => {
        const span = document.createElement('span');
        span.className = 'pill';
        span.textContent = t;
        tagPills.appendChild(span);
      });
      backdrop.style.display = 'flex';
      backdrop.setAttribute('aria-hidden', 'false');
    }

    function closeModal() {
      backdrop.style.display = 'none';
      backdrop.setAttribute('aria-hidden', 'true');
    }

    closeBtn.addEventListener('click', closeModal);
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

    // === Filtering & Sorting ===
    function normalize(str) { return (str || '').toLowerCase(); }

    function applyFilters() {
      const term = normalize(q.value);
      const ser = normalize(series.value);
      const sortBy = sortSel.value;

      let list = ANIMATRONICS.filter(a => {
        const hay = [
          a.name,
          a.firstAppearance,
          ...(a.appearances.games || []),
          ...(a.appearances.books || []),
          ...(a.tags || [])
        ].map(normalize).join(' \n ');
        const matchesTerm = !term || hay.includes(term);
        const matchesSeries = !ser || hay.includes(ser);
        return matchesTerm && matchesSeries;
      });

      if (sortBy === 'name') {
        list.sort((x, y) => x.name.localeCompare(y.name));
      } else if (sortBy === 'game') {
        list.sort((x, y) => (x.firstAppearance || '').localeCompare(y.firstAppearance || ''));
      }

      renderCards(list);
    }

    q.addEventListener('input', applyFilters);
    series.addEventListener('change', applyFilters);
    sortSel.addEventListener('change', applyFilters);

    // Initial render
    renderCards(ANIMATRONICS.sort((a,b)=>a.name.localeCompare(b.name)));

    // --- Developer/Jesse tips ---
    // 1) To add more characters, append objects to ANIMATRONICS. Keep fields short and original (no copied book/game text).
    // 2) Replace the placeholder image URL with your preferred image source or local file path.
    // 3) All content is contained in this single HTML file.
  </script>
